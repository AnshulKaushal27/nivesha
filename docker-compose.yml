services:
  # ══════════════════════════════════════════════════════════════════
  # Postgres — the system of record. Same image and settings as the
  # instance-local Postgres on the EC2 box, so dev == prod.
  # ══════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: ai-arena-postgres
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════
  # Backend — FastAPI + scheduler
  # ══════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-arena-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://arena:arena@postgres:5432/arena
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════
  # Frontend — Next.js
  # ══════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./arena-frontend
      dockerfile: Dockerfile
    container_name: ai-arena-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
